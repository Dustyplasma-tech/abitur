<!doctype html>
<html lang="de" data-lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<title>Abitur Training</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2230;--mute:#5d677a;--pri:#1f4e8c;--pri-ink:#fff;--ok:#1b7f3b;--bad:#b3261e;--warn:#b26a00;--line:#dde2ec;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--ink:#e8ecf5;--mute:#9aa6bd;--pri:#6aa3ff;--pri-ink:#07101f;--ok:#58c27d;--bad:#ff8a80;--warn:#ffb74d;--line:#2b3347}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;color:var(--pri);text-decoration:none;margin-right:auto}
select,input,textarea,button{font:inherit;color:inherit}
select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 8px}
main{max-width:860px;margin:0 auto;padding:12px 14px 24px;outline:none}
h1{font-size:1.45rem;margin:.4em 0}h2{font-size:1.15rem;margin:1.2em 0 .4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--pri)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.big{width:100%;min-height:56px;font-size:1.1rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs a{flex:1;text-align:center;padding:14px 4px;text-decoration:none;color:var(--mute);font-size:.9rem;min-height:56px}
.tabs a.on{color:var(--pri);font-weight:700;box-shadow:inset 0 3px 0 var(--pri)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--bad)}
.bar.good>i{background:var(--ok)}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-right:4px}
.muted{color:var(--mute)}.small{font-size:.85rem}
.topic{display:block;text-decoration:none;color:inherit}.topic .t{font-weight:600}
.prompt{white-space:pre-wrap}
input[type=text],textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.sol{border-left:4px solid var(--pri);padding:6px 12px;margin:10px 0;background:var(--bg);white-space:pre-wrap}
.good{color:var(--ok)}.badtxt{color:var(--bad)}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}
.tablewrap{overflow-x:auto}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:10px;overflow-x:auto}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.cols.two{grid-template-columns:1fr 1fr}main{padding:16px 20px}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer}.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
[hidden]{display:none!important}

/* language switch: one span per language, shown by <html data-lang> */
[data-lang=de] [data-x=en],[data-lang=en] [data-x=de]{display:none!important}
[data-lang=both] span.en::before{content:" · "}
[data-lang=both] .tabs .en::before{content:" / "}
.cols>[data-x]{min-width:0}
@media(min-width:760px){[data-lang=both] .cols{grid-template-columns:1fr 1fr}}
.en.sub{color:var(--mute)}
/* practice fields */
.fields{margin:10px 0}.fld{margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.fld.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.fld.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.fl{font-weight:600;margin-right:6px}.inl{display:flex;gap:8px;align-items:center}.inl input{flex:1}.unit{color:var(--mute)}
fieldset.fld legend{padding:0 4px}
.opt{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 6px;border-radius:8px;cursor:pointer}.opt input{width:22px;height:22px;flex:none}
.verdict{margin-top:6px}.act{margin-top:6px}
/* vocab */
.vc{padding:10px 0;border-bottom:1px solid var(--line)}.vc:last-child{border:0}
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.vde{font-weight:600}.vzh{color:var(--mute)}.vrow .btn{margin-left:auto}
.vrow .ven{font-weight:600;color:var(--pri)}
.btn.sm{min-height:40px;padding:0 12px;font-size:.9rem}
.expl{margin-top:8px;border-left:4px solid var(--pri);padding:4px 12px;background:var(--bg)}.expl .en{color:var(--mute);margin-top:4px}
.expl [data-x=en]::before{content:none!important}
.tag.warn{border-color:var(--warn);color:var(--warn)}
[data-lang=both] .btn .en::before{content:none}[data-lang=both] .btn .en{display:block;font-size:.8em;font-weight:400}
.expl .en2{color:var(--mute);margin-top:4px;font-size:.92rem}

/* game */
.xpchip{font-size:.82rem;font-weight:700;padding:6px 10px;border-radius:99px;background:linear-gradient(90deg,#ffb300,#ff7043);color:#2b1700;text-decoration:none;white-space:nowrap}
.tabs a[data-tab=rewards]{font-size:1.2rem}
.xpcard{display:block;text-decoration:none;color:inherit;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 14%,var(--card)),var(--card))}
.lvl{display:flex;gap:10px;align-items:center;margin-bottom:6px}.lvl .muted{margin-left:auto}
.lvbadge{background:var(--pri);color:var(--pri-ink);font-weight:800;border-radius:10px;padding:2px 10px}
.bar.xp{height:16px;border-radius:10px}.bar.xp>i{background:linear-gradient(90deg,#ffb300,#ff7043);transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.stats div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}.stats b{display:block;font-size:1.3rem}.stats span{color:var(--mute);font-size:.8rem}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.bd{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:var(--r);opacity:.55;background:var(--card)}.bd.on{opacity:1;border:1px solid var(--warn)}.bi{font-size:2rem}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw{text-align:center;color:var(--mute);font-size:.78rem}
.cd{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;line-height:1.1}.cd i{font-style:normal}.cd b{font-size:.75rem}.cd.empty{border:0}
.cd.done{background:var(--ok);color:#fff;border-color:var(--ok)}.cd.part{background:color-mix(in srgb,var(--warn) 25%,var(--card))}.cd.today{outline:3px solid var(--pri);outline-offset:1px}
.gamebar{position:sticky;top:57px;z-index:4;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:8px;font-size:.9rem}
.reward{margin:12px 0;padding:12px;border-radius:var(--r);background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid var(--warn);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.rp{font-weight:800;font-size:1.2rem}.lvup,.newbd{width:100%;font-weight:700}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.center{text-align:center}.stars{font-size:2.8rem;letter-spacing:8px;color:var(--mute)}.stars .on{color:#ffb300;display:inline-block;animation:pop .6s both}
.big2{font-size:1.3rem;margin:.2em 0}.xpgain{font-size:1.6rem;font-weight:800;color:var(--warn);margin:.2em 0}
.cf{position:fixed;top:-30px;font-size:1.6rem;animation:fall 2.8s ease-in forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){.pop,.stars .on,.cf{animation:none}.cf{display:none}}
.sy{font-size:.8rem;color:var(--mute);white-space:nowrap}.sy[data-s=ok]{color:var(--ok)}.sy[data-s=off]{color:var(--bad)}

</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Abitur&nbsp;Training</a>
  <span id="sy" class="sy" role="status"></span>
  <a id="xp" class="xpchip" href="#/rewards" aria-label="Belohnungen"></a>
  <select id="subject" aria-label="Fach / Subject"></select>
</header>
<main id="app" tabindex="-1"></main>
<nav class="tabs" aria-label="Navigation">
  <a href="#/" data-tab="home">Start</a>
  <a href="#/practice" data-tab="practice">Üben</a>
  <a href="#/topics" data-tab="topics">Themen</a>
  <a href="#/vocab" data-tab="vocab">Wörter</a>
  <a href="#/rewards" data-tab="rewards">🏆</a>
  <a href="#/progress" data-tab="progress">Stand</a>
</nav>
<script>
'use strict';
/* grade.js – checks typed / selected answers. Works in the browser (window.Grade) and in Node (module.exports).
   A "field" comes from content/<fach>/questions.json (see tools/build_answers.py):
     {k:'num',   v:number, tol?, unit?, pi?, pct?}      one number (fraction, decimal comma, π and units are accepted)
     {k:'expr',  v:'2x-14', form?:'expanded'|'factored'|'vertex'}   algebra term (compared as a polynomial)
     {k:'text',  v:['5√2', ...]}                         short text, any of the listed spellings
     {k:'primes',v:{"2":2,"3":1,"7":1}}                 prime factorization (any order, 2·2 or 2²)
     {k:'set',   v:[1,3], none?:true}                    several numbers in any order ("x = 1 oder x = 3", "1; 3", "keine")
     {k:'choice',o:[...], c:[indices], multi?:true}     selection
   grade(field, input) -> {ok:boolean, msg?:string}   input = string (or array of indices for 'choice'). */
(function(root){

const SUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
const SUB={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
function clean(s){
  s=String(s==null?'':s).replace(/[−–—‒]/g,'-').replace(/[    ]/g,' ')
    .replace(/[×·⋅∙]/g,'*').replace(/[÷]/g,':');
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(c=>SUP[c]).join(''));
  s=s.replace(/[₀-₉]+/g,m=>[...m].map(c=>SUB[c]).join(''));
  return s.trim();
}

/* ---------------- numbers ---------------- */
function parseNumber(raw,opt){
  opt=opt||{};
  let s=clean(raw).toLowerCase();
  if(!s)return null;
  let m=s.match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)\s*[a-zäöü°€%²³ ]*$/);       // mixed number "1 5/12"
  if(m){const w=+m[1],n=+m[2],d=+m[3];if(!d)return null;return (w<0||/^-/.test(m[1])?-1:1)*(Math.abs(w)+n/d)}
  s=s.replace(/^[a-zα-ωäöü][a-z0-9α-ω′']{0,2}\s*[=≈]\s*/i,'').replace(/^[≈~]\s*/,'');   // "x = 5", "V = 24 cm³", "≈ 4,9"
  s=s.replace(/\s+/g,'');
  let hasPi=/π|(?<![a-z])pi(?![a-z])/.test(s);
  if(hasPi)s=s.replace(/π|(?<![a-z])pi(?![a-z])/g,'@').replace(/\*?@\*?/g,'@');
  s=s.replace(/,/g,'.');
  let pos=0,v;
  const num='(\\d*\\.?\\d+)';
  m=s.match(new RegExp('^([+-]?)'+num+'(?:/'+num+')?'));
  if(m){v=parseFloat(m[2]);if(m[3]!==undefined){const d=parseFloat(m[3]);if(!d)return null;v=v/d}if(m[1]==='-')v=-v;pos=m[0].length}
  else if(/^[+-]?@/.test(s)){v=1;if(s[0]==='-'){v=-1;pos=1}else if(s[0]==='+')pos=1}
  else return null;
  let rest=s.slice(pos);
  if(hasPi){                       // 90π  or  π90  or  π
    if(rest[0]==='@'){v*=Math.PI;rest=rest.slice(1);const m2=rest.match(new RegExp('^'+num));if(m2){v*=parseFloat(m2[1]);rest=rest.slice(m2[0].length)}}
    else return null;
  }
  const pct=/%/.test(rest);
  if(!/^[a-zäöüß°€%²³^0-9.\/]*$/.test(rest))return null;
  if(/^[0-9.]/.test(rest))return null;                                      // "12 5" is not a number
  if(pct&&opt.pct)v=v/100;
  return v;
}
function fmtNum(v){return String(Math.round(v*1e6)/1e6).replace('.',',')}
function numOK(v,exp,tol){tol=tol||0;return Math.abs(v-exp)<=Math.max(tol,Math.abs(exp)*1e-9,1e-9)+1e-12}

/* ---------------- polynomial algebra ---------------- */
const mono=k=>{const o={};if(k)for(const p of k.split(',')){const[a,b]=p.split(':');o[a]=+b}return o};
const monoKey=o=>Object.keys(o).filter(k=>o[k]).sort().map(k=>k+':'+o[k]).join(',');
const P={
  c:v=>Math.abs(v)<1e-12?new Map():new Map([['',v]]),
  v:n=>new Map([[n+':1',1]]),
  add(a,b,sg){const r=new Map(a);for(const[k,x]of b){const y=(r.get(k)||0)+sg*x;if(Math.abs(y)<1e-10)r.delete(k);else r.set(k,y)}return r},
  mul(a,b){const r=new Map();for(const[ka,x]of a)for(const[kb,y]of b){const A=mono(ka),B=mono(kb);for(const k in B)A[k]=(A[k]||0)+B[k];const k=monoKey(A),z=(r.get(k)||0)+x*y;if(Math.abs(z)<1e-10)r.delete(k);else r.set(k,z)}return r},
  pow(a,n){let r=P.c(1);for(let i=0;i<n;i++)r=P.mul(r,a);return r},
  isConst(a){return a.size===0||(a.size===1&&a.has(''))},
  cval(a){return a.size?a.get(''):0},
  eq(a,b){const d=P.add(a,b,-1);for(const[,x]of d)if(Math.abs(x)>1e-7)return false;return true},
};
function lex(s){
  const t=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(c===' '){i++;continue}
    let m;
    if((m=s.slice(i).match(/^(\d+[.,]\d+|\d+|[.,]\d+)/))){t.push({t:'n',v:parseFloat(m[1].replace(',','.'))});i+=m[1].length;continue}
    if(/[a-zA-Z]/.test(c)){t.push({t:'v',v:c});i++;continue}
    if('+-*/:^()'.includes(c)){t.push({t:c});i++;continue}
    throw new Error('char '+c);
  }
  return t;
}
function parsePoly(tokens){
  let i=0;
  const peek=()=>tokens[i],next=()=>tokens[i++];
  function expr(){let r=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const o=next().t;const b=term();r=P.add(r,b,o==='+'?1:-1)}return r}
  const startsFactor=t=>t&&(t.t==='n'||t.t==='v'||t.t==='(');
  function term(){
    let r=unary();
    for(;;){
      const t=peek();
      if(!t)break;
      if(t.t==='*'){next();r=P.mul(r,unary())}
      else if(t.t==='/'||t.t===':'){next();const d=unary();if(!P.isConst(d)||Math.abs(P.cval(d))<1e-12)throw new Error('div');r=P.mul(r,P.c(1/P.cval(d)))}
      else if(startsFactor(t)){r=P.mul(r,power())}
      else break;
    }
    return r;
  }
  function unary(){const t=peek();if(t&&t.t==='-'){next();return P.mul(P.c(-1),unary())}if(t&&t.t==='+'){next();return unary()}return power()}
  function power(){
    let b=atom();
    while(peek()&&peek().t==='^'){
      next();let neg=false;if(peek()&&peek().t==='-'){next();neg=true}
      const e=peek();
      if(e&&e.t==='('){next();const x=expr();if(!peek()||peek().t!==')')throw new Error(')');next();if(!P.isConst(x))throw new Error('exp');var n=P.cval(x)}
      else if(e&&e.t==='n'){next();n=e.v}else throw new Error('exp');
      if(neg)n=-n;
      if(n<0||n!==Math.floor(n)||n>12)throw new Error('exp');
      b=P.pow(b,n);
    }
    return b;
  }
  function atom(){
    const t=next();
    if(!t)throw new Error('end');
    if(t.t==='n')return P.c(t.v);
    if(t.t==='v')return P.v(t.v);
    if(t.t==='('){const x=expr();if(!peek()||peek().t!==')')throw new Error(')');next();return x}
    throw new Error('atom');
  }
  const r=expr();
  if(i<tokens.length)throw new Error('rest');
  return r;
}
/* split tokens at depth 0 into additive terms */
function topTerms(tokens){
  const out=[];let cur=[],d=0;
  tokens.forEach((t,idx)=>{
    if(t.t==='(')d++;
    if(t.t===')')d--;
    if(d===0&&(t.t==='+'||t.t==='-')&&cur.length&&!['+','-','*','/',':','^','('].includes(cur[cur.length-1].t)){out.push(cur);cur=t.t==='-'?[t]:[]}
    else cur.push(t);
  });
  if(cur.length)out.push(cur);
  return out;
}
function parseExpr(raw){
  let s=clean(raw).replace(/^\s*(?:[a-zA-Z]\s*(?:\(\s*[a-zA-Z]\s*\))?)\s*=\s*/,'');
  const tokens=lex(s);
  if(!tokens.length)throw new Error('empty');
  const poly=parsePoly(tokens);
  return {poly,tokens,s};
}
function gradeExpr(f,input){
  let u;
  try{u=parseExpr(input)}catch(e){return {ok:false,msg:'Das kann ich nicht lesen. Beispiel: 2x - 14 oder (x-3)^2'}}
  const e=parseExpr(f.v);
  if(!P.eq(u.poly,e.poly))return {ok:false};
  const terms=topTerms(u.tokens);
  if(f.form==='expanded'){
    if(u.tokens.some(t=>t.t==='('))return {ok:false,msg:'Der Wert stimmt, aber schreibe ohne Klammern (ausmultiplizieren).'};
    const keys=new Set();
    for(const tr of terms){const p=parsePoly(tr);if(p.size>1)return {ok:false,msg:'Fasse zusammen.'};const k=p.size?[...p.keys()][0]:'#0';if(keys.has(k))return {ok:false,msg:'Der Wert stimmt, aber fasse gleichartige Glieder noch zusammen.'};keys.add(k)}
  }
  if(f.form==='factored'&&(!u.tokens.some(t=>t.t==='(')||terms.length>1))return {ok:false,msg:'Der Wert stimmt, aber schreibe das Ergebnis als Produkt (faktorisiert).'};
  if(f.form==='vertex'&&(!u.tokens.some(t=>t.t==='(')||terms.length>2))return {ok:false,msg:'Der Wert stimmt, aber schreibe die Scheitelform a(x - d)² + e.'};
  return {ok:true};
}

/* ---------------- sets, primes, text ---------------- */
function parseSet(raw,opt){
  let s=clean(raw).toLowerCase();
  if(/^\s*$/.test(s))return null;
  if(/keine|k\.\s?l\.|∅|\{\s*\}|nicht lösbar|unlösbar/.test(s)&&!/\d/.test(s))return [];
  s=s.replace(/[a-z]\s*(?:\d\s*)?=\s*/g,' ');
  s=s.replace(/±\s*([\d.,]+)/g,(m,a)=>a+';-'+a);
  s=s.replace(/\boder\b|\bund\b|\||\{|\}|\[|\]|;|\//g,';').replace(/,\s+/g,';');
  const out=[];
  for(const part of s.split(';')){const t=part.trim();if(!t)continue;const v=parseNumber(t,opt);if(v===null)return null;out.push(v)}
  return out;
}
function uniq(a){const r=[];for(const x of a)if(!r.some(y=>Math.abs(x-y)<1e-9))r.push(x);return r}
function isPrime(n){if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true}
function parsePrimes(raw){
  let s=clean(raw).toLowerCase().replace(/\s+/g,' ').replace(/^[^=]*=\s*(?=\d)/,'');
  s=s.replace(/\s*\*\s*/g,'*').replace(/\s*\^\s*/g,'^').replace(/\bx\b/g,'*');
  if(!/\*/.test(s)&&/^\d+(\^\d+)?( \d+(\^\d+)?)+$/.test(s))s=s.replace(/ /g,'*');
  const res={};
  for(const f of s.split('*')){
    const m=f.trim().match(/^(\d+)(?:\^(\d+))?$/);
    if(!m)return null;
    const b=+m[1],e=m[2]?+m[2]:1;
    if(!isPrime(b))return {bad:b};
    res[b]=(res[b]||0)+e;
  }
  return res;
}
function normText(s){
  s=clean(s).toLowerCase().replace(/sqrt|wurzel/g,'√').replace(/[\s*]/g,'').replace(/√\((\d+)\)/g,'√$1').replace(/[.]$/,'').replace(/,/g,'.');
  return s;
}

/* ---------------- main ---------------- */
function grade(f,input){
  switch(f.k){
    case 'num':{
      const v=parseNumber(input,{pct:f.pct});
      if(v===null)return {ok:false,msg:'Das ist keine Zahl.'};
      return {ok:numOK(v,f.v,f.tol)};
    }
    case 'expr':return gradeExpr(f,input);
    case 'text':{
      const n=normText(input);
      return {ok:f.v.some(a=>normText(a)===n)};
    }
    case 'primes':{
      const r=parsePrimes(input);
      if(r===null)return {ok:false,msg:'Beispiel: 2^2 * 3 * 7'};
      if(r.bad)return {ok:false,msg:r.bad+' ist keine Primzahl.'};
      const ks=Object.keys(f.v);
      return {ok:ks.length===Object.keys(r).length&&ks.every(k=>r[k]===f.v[k])};
    }
    case 'set':{
      const a=parseSet(input,{pct:false});
      if(a===null)return {ok:false,msg:'Das kann ich nicht lesen. Beispiel: 1; 3'};
      const u=uniq(a).sort((x,y)=>x-y),e=uniq(f.v).sort((x,y)=>x-y);
      return {ok:u.length===e.length&&u.every((x,i)=>numOK(x,e[i],f.tol))};
    }
    case 'choice':{
      const sel=(Array.isArray(input)?input:[input]).map(Number).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
      if(f.multi){const c=f.c.slice().sort((a,b)=>a-b);return {ok:sel.length===c.length&&sel.every((x,i)=>x===c[i])}}
      return {ok:sel.length===1&&f.c.includes(sel[0])};
    }
  }
  return {ok:false,msg:'?'};
}
/* canonical correct input for a field – used by tests */
function example(f){
  switch(f.k){
    case 'num':return fmtNum(f.v);
    case 'expr':return f.v;
    case 'text':return f.v[0];
    case 'primes':return Object.keys(f.v).map(k=>f.v[k]>1?k+'^'+f.v[k]:k).join('*');
    case 'set':return f.v.length?f.v.map(fmtNum).join('; '):'keine';
    case 'choice':return f.multi?f.c.slice():[f.c[0]];
  }
}
const api={grade,example,parseNumber,parseExpr,parseSet,fmtNum};
if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.Grade=api;
})(typeof window!=='undefined'?window:globalThis);

const DAY=864e5, BOX_DAYS=[0,1,3,7,14], SESSION_MIN=15;

/* ---------- storage ---------- */
let USER='';

/* ---------- data ---------- */
/* ---------- password gate: data.enc = salt(16) + iv(12) + AES-256-GCM(JSON). key = PBKDF2-SHA256(password, salt) ---------- */
const ITER=600000;
let DB=null;
const b64=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function openBundle(buf,key){const u=new Uint8Array(buf);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(16,28)},key,u.slice(28));return JSON.parse(new TextDecoder().decode(pt))}
const uhash=async u=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('abitur:'+u.trim().toLowerCase())))].slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('');
async function fetchBundle(u){const r=await fetch('d-'+await uhash(u)+'.enc');if(!r.ok)throw new Error('no account');return r.arrayBuffer()}
async function unlock(){
  try{localStorage.removeItem('abitur.key')}catch(e){}
  try{const sess=JSON.parse(localStorage.getItem('abitur.sess'));if(sess&&sess.u){const buf=await fetchBundle(sess.u);DB=await openBundle(buf,await crypto.subtle.importKey('raw',unb64(sess.k),'AES-GCM',true,['decrypt']));USER=sess.u;return}}catch(e){try{localStorage.removeItem('abitur.sess')}catch(_){}}
  await new Promise(res=>{
    $('.top').hidden=true;document.querySelector('.tabs').hidden=true;
    view(`<h1>Abitur Training</h1><form class="card" id="gate"><p>Bitte Namen und Passwort eingeben.</p><p><input type="text" id="un" autocomplete="username" autocapitalize="none" spellcheck="false" aria-label="Name" placeholder="Name" autofocus></p><p><input type="password" id="pw" autocomplete="current-password" aria-label="Passwort" placeholder="Passwort"></p><button class="btn big" type="submit">Öffnen</button><p id="gerr" class="badtxt" role="alert"></p></form>`);
    $('#gate').onsubmit=async e=>{e.preventDefault();const b=$('#gate button');b.disabled=true;$('#gerr').textContent='';
      const u=$('#un').value.trim().toLowerCase();
      try{const buf=await fetchBundle(u),k=await deriveKey($('#pw').value,new Uint8Array(buf,0,16));DB=await openBundle(buf,k);USER=u;
        try{localStorage.setItem('abitur.sess',JSON.stringify({u,k:b64(new Uint8Array(await crypto.subtle.exportKey('raw',k)))}))}catch(_){}
        $('.top').hidden=false;document.querySelector('.tabs').hidden=false;res()}
      catch(_){$('#gerr').textContent='Name oder Passwort stimmt nicht.';b.disabled=false}}})}
async function lock(){try{await Promise.race([syncNow(),sleep(3000)])}catch(e){}try{localStorage.removeItem('abitur.sess')}catch(e){}location.hash='#/';location.reload()}

/* ---------- sync: progress is encrypted in the browser and stored in a private GitHub repo, so every device of an account shows the same progress ---------- */
let syncT=null,syncBusy=false,syncDirty=false,syncKey=null;
const SY=()=>DB&&DB.sync&&DB.sync.token?DB.sync:null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setSyncState(st){const e=$('#sy');if(!e)return;e.dataset.s=st;e.textContent={ok:'☁ ✓',busy:'☁ …',off:'☁ ✗',none:''}[st]||'';e.title={ok:'Fortschritt online gespeichert',busy:'Wird gespeichert …',off:'Gerade offline – wird später gespeichert',none:''}[st]||''}
async function getSyncKey(){return syncKey??=await crypto.subtle.importKey('raw',unb64(SY().key),'AES-GCM',false,['encrypt','decrypt'])}
async function encryptState(st){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await getSyncKey(),new TextEncoder().encode(JSON.stringify(st))));
  const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);return b64(new TextEncoder().encode(JSON.stringify({v:1,d:b64(all)})))}
async function decryptState(content){const j=JSON.parse(new TextDecoder().decode(unb64(content.replace(/\s/g,'')))),u=unb64(j.d);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},await getSyncKey(),u.slice(12))))}
function gh(method,body){const s=SY();
  return fetch(`https://api.github.com/repos/${s.repo}/contents/${s.path}`+(method==='GET'?`?ref=${s.branch||'main'}&_=${Date.now()}`:''),{method,cache:'no-store',headers:{Authorization:'Bearer '+s.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
/* merge two progress states (a = this device, b = other device): per entry the one with more answers wins, counters never go down, badges are united, the newer running test wins */
function pickMax(A,B,key){const o={};for(const id of new Set([...Object.keys(A||{}),...Object.keys(B||{})])){const x=(A||{})[id],y=(B||{})[id];o[id]=!x?y:!y?x:((x[key]||0)>(y[key]||0)||((x[key]||0)===(y[key]||0)&&(x.last||x.due||0)>=(y.last||y.due||0)))?x:y}return o}
function mergeS(a,b){
  const m={v:1,lang:a.lang||'de',subject:a.subject||b.subject||null,p:{},log:{},ts:Math.max(a.ts||0,b.ts||0)};
  for(const s of new Set([...Object.keys(a.p||{}),...Object.keys(b.p||{})])){const A=(a.p||{})[s]||{},B=(b.p||{})[s]||{};m.p[s]={t:pickMax(A.t,B.t,'n'),q:pickMax(A.q,B.q,'n')}}
  for(const d of new Set([...Object.keys(a.log||{}),...Object.keys(b.log||{})])){const x=(a.log||{})[d],y=(b.log||{})[d];m.log[d]=!x?y:!y?x:((x.n||0)+(x.tests||0)*1e3>=(y.n||0)+(y.tests||0)*1e3)?x:y}
  const ga=a.g||{},gb=b.g||{};m.g={xp:Math.max(ga.xp||0,gb.xp||0),correct:Math.max(ga.correct||0,gb.correct||0),best:Math.max(ga.best||0,gb.best||0),tests:Math.max(ga.tests||0,gb.tests||0),badges:{...(gb.badges||{}),...(ga.badges||{})}};
  const nw=(a.ts||0)>=(b.ts||0)?a:b;m.run=nw.run||null;m.last=nw.last||null;return m}
const core=s=>JSON.stringify({p:s.p,log:s.log,g:s.g,run:s.run,last:s.last,subject:s.subject});
function saveLocal(){try{localStorage.setItem(storeKey(),JSON.stringify(S))}catch(e){}}
function schedulePush(ms){if(!SY())return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),ms||4000)}
async function syncNow(force){
  if(!SY()||!S)return;
  if(syncBusy){syncDirty=true;return}
  syncBusy=true;setSyncState('busy');
  try{
    for(let i=0;i<3;i++){
      const r=await gh('GET');let sha=null,remote=null;
      if(r.status===200){const j=await r.json();sha=j.sha;if(!force)remote=await decryptState(j.content)}else if(r.status!==404)throw new Error('GET '+r.status);
      if(remote){
        const keepRun=typeof run!=='undefined'&&run&&S.run===run,m=mergeS(S,remote);
        if(keepRun)m.run=S.run;
        if(core(m)!==core(S)){S.p=m.p;S.log=m.log;S.g=m.g;S.ts=m.ts;if(!keepRun){S.run=m.run;S.last=m.last}saveLocal();updateChip()}
      }
      if(remote&&core(S)===core(remote)){setSyncState('ok');break}
      const put=await gh('PUT',{message:'sync',branch:SY().branch||'main',content:await encryptState(S),...(sha?{sha}:{})});
      if(put.status===200||put.status===201){setSyncState('ok');break}
      if(put.status===409||put.status===422){force=false;continue}
      throw new Error('PUT '+put.status)}
  }catch(e){setSyncState('off')}
  syncBusy=false;if(syncDirty){syncDirty=false;schedulePush(1500)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(syncT);syncNow()}else syncNow()});
window.addEventListener('online',()=>syncNow());


async function loadSubject(id){

  d.qByTopic={};for(const q of d.questions)for(const t of q.topics||[])(d.qByTopic[t]??=[]).push(q);
  d.klassen=[...new Set(d.topics.map(t=>t.klasse))].sort((a,b)=>a-b);
  D[id]=d;return d;
}

/* ---------- weakness ---------- */
function prior(t){const m=Math.max(1,...D[cur].topics.map(x=>x.points_lost||0));return t.points_lost==null?.5:Math.min(1,.15+.85*t.points_lost/m)}
function weakness(t){const s=P().t[t.id]||{n:0,wrong:0};return (3*prior(t)+s.wrong)/(3+s.n)}   // prior counts like 3 answers
function mastery(t){return 1-weakness(t)}

/* ---------- block rendering ---------- */
function blocks(bl){return (bl||[]).map(b=>{
  if(b.type==='p')return `<p>${esc(b.text)}</p>`;
  if(b.type==='ol')return `<ol>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;
  if(b.type==='table')return `<div class="tablewrap"><table><thead><tr>${b.header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return `<pre>${esc(b.text)}</pre>`}).join('')}

/* ---------- views ---------- */
const view=h=>{$('#app').innerHTML=h;$('#app').focus({preventScroll:true});window.scrollTo(0,0)};
function bar(w){return `<div class="bar ${w<.35?'good':''}" role="img" aria-label="${Math.round(w*100)}%"><i style="width:${Math.round(w*100)}%"></i></div>`}
function weakest(n,klasse){return D[cur].topics.filter(t=>!klasse||t.klasse===klasse).map(t=>[t,weakness(t)]).sort((a,b)=>b[1]-a[1]).slice(0,n)}
const tTitle=t=>esc(t.title_de);

  <div class="row"><a class="btn ghost" href="#/topics">${X('Alle Themen','All topics')}</a><a class="btn ghost" href="#/progress">${X('Stand & Sicherung','Progress & backup')}</a></div>`)}

function topics(q){
  const d=D[cur],k=+q.get('k')||0;
  const list=d.topics.filter(t=>!k||t.klasse===k).map(t=>[t,weakness(t)]).sort((a,b)=>b[1]-a[1]);

function vocabCard(v){
  return `<div class="vc" data-v="${v.id}"><div class="vrow"><span class="vde">${esc(v.de)}</span><span class="ven">${esc(v.en)}</span><span class="vzh" lang="zh">${esc(v.zh)}</span><span class="tag">${kl(v.klasse)}</span>

function topic(id){
  const d=D[cur],t=d.tById[id];if(!t)return view('<p>Thema nicht gefunden.</p>');

  ${de}${en}
  ${vocab.length?`<h2>${X('Wörter','Words')}</h2><div class="card">${vocab.map(vocabCard).join('')}</div>`:''}
  ${t.curriculum&&t.curriculum.doc?`<p class="muted small">Lehrplan: ${esc(t.curriculum.doc)}${t.curriculum.verified?'':' (Seitenangabe noch nicht geprüft)'}</p>`:''}`)}

/* ---------- game: XP, levels, badges, streak, calendar ---------- */
const TITLES=['Anfänger','Rechenlehrling','Zahlenjäger','Formelprofi','Algebra-Ass','Geometrie-Held','Mathe-Meister','Abitur-Legende'];
const G=()=>S.g??={xp:0,correct:0,best:0,tests:0,badges:{}};
const xpFor=L=>50*L*(L-1);
const levelOf=xp=>Math.floor((1+Math.sqrt(1+xp/12.5))/2);
function lv(xp){const L=levelOf(xp);return {L,cur:xp-xpFor(L),need:xpFor(L+1)-xpFor(L),title:TITLES[Math.min(L-1,TITLES.length-1)]}}
const testsOn=d=>(S.log[d]&&S.log[d].tests)||0;
const testsToday=()=>testsOn(today());
function dstr(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function streak(){const dt=new Date();if(!testsOn(dstr(dt)))dt.setDate(dt.getDate()-1);let n=0;while(testsOn(dstr(dt))>0){n++;dt.setDate(dt.getDate()-1)}return n}
const BADGES=[
 {id:'first',i:'🎯',n:'Erster Treffer',d:'Die erste Aufgabe richtig',t:g=>g.correct>=1},
 {id:'c5',i:'🔥',n:'Serie 5',d:'5 Aufgaben in Folge richtig',t:g=>g.best>=5},
 {id:'c10',i:'🚀',n:'Serie 10',d:'10 Aufgaben in Folge richtig',t:g=>g.best>=10},
 {id:'q50',i:'⭐',n:'50 richtig',d:'50 Aufgaben richtig gelöst',t:g=>g.correct>=50},
 {id:'q200',i:'🏅',n:'200 richtig',d:'200 Aufgaben richtig gelöst',t:g=>g.correct>=200},
 {id:'t1',i:'📝',n:'Erster Test',d:'Den ersten Test abgeschlossen',t:g=>g.tests>=1},
 {id:'d3',i:'🎉',n:'Dreifach-Tag',d:'3 Tests an einem Tag',t:()=>testsToday()>=3},
 {id:'s3',i:'📅',n:'3 Tage in Folge',d:'3 Tage hintereinander geübt',t:()=>streak()>=3},
 {id:'s7',i:'🏆',n:'Wochen-Held',d:'7 Tage hintereinander geübt',t:()=>streak()>=7},
 {id:'l5',i:'👑',n:'Level 5',d:'Level 5 erreicht',t:g=>levelOf(g.xp)>=5}];
function awardBadges(){const g=G(),out=[];for(const b of BADGES)if(!g.badges[b.id]&&b.t(g)){g.badges[b.id]=today();out.push(b)}return out}
const badgeById=id=>BADGES.find(b=>b.id===id);
function updateChip(){const e=$('#xp');if(!e)return;const L=lv(G().xp);e.textContent=`Lv ${L.L} · ${G().xp} XP`}
const go=h=>{if(location.hash===h)route();else location.hash=h};
function xpCard(){const g=G(),L=lv(g.xp),pct=Math.round(100*L.cur/L.need);

/* ---------- practice: the learner types / selects, the app judges. The running test is saved after every step, so tab switches and reloads resume it. ---------- */
let run=null,tm;
const items=q=>q.parts&&q.parts.length?q.parts:[q];
const cu=()=>({q:D[cur].qById[run.curQ],t:D[cur].tById[run.curT]});
const newRun=o=>Object.assign({subject:cur,topic:'',k:0,timed:false,elapsed:0,start:Date.now(),seen:[],n:0,ok:0,hist:[],curQ:null,curT:null,res:[],items:[],fin:false,combo:0,xp:0,mult:1,queue:null,qi:0,reward:null,newBadges:[],counted:false},o);
function persist(){if(!run)return;run.elapsed=Date.now()-run.start;S.run=run;save()}
function pickQuestion(topicId,klasse){
  const d=D[cur],pool=d.topics.filter(t=>(!topicId||t.id===topicId)&&(!klasse||t.klasse===klasse)&&(d.qByTopic[t.id]||[]).length);
  if(!pool.length)return null;
  const ws=pool.map(t=>weakness(t)**2+.03);let r=Math.random()*ws.reduce((a,b)=>a+b,0),t=pool[0];
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){t=pool[i];break}}
  const qs=d.qByTopic[t.id].filter(q=>!run.seen.includes(q.id)).sort((a,b)=>{const A=P().q[a.id],B=P().q[b.id];return (A?A.due:0)-(B?B.due:0)});
  const q=qs[0]||d.qByTopic[t.id][Math.floor(Math.random()*d.qByTopic[t.id].length)];
  return {q,t}
}
function practice(qs){
  if([...qs.keys()].length===0&&S.run&&S.run.subject===cur){run=S.run;run.start=Date.now()-(run.elapsed||0);return run.curQ?renderQ():nextQ()}   // resume
  run=newRun({topic:qs.get('topic')||'',k:+qs.get('k')||0,timed:qs.get('timed')==='1'});
  try{history.replaceState(null,'','#/practice')}catch(e){}
  nextQ();
}
function nextQ(){
  if(run.timed&&Date.now()-run.start>SESSION_MIN*60e3)return finishRun();
  const d=D[cur];let x;
  if(run.queue){if(run.qi>=run.queue.length)return finishRun();const [qid,tid]=run.queue[run.qi++];x={q:d.qById[qid],t:d.tById[tid]}}
  else x=pickQuestion(run.topic,run.k);
  if(!x){view('<p>Keine Aufgaben für diese Auswahl.</p>');return}
  run.curQ=x.q.id;run.curT=x.t.id;run.seen.push(x.q.id);
  run.res=items(x.q).map(()=>null);run.items=items(x.q).map(()=>({vals:null,done:false,skip:false}));run.fin=false;run.reward=null;
  persist();renderQ()
}
function fieldHTML(f,i,j){
  const id=`f${i}_${j}`,lab=f.label?`<span class="fl">${esc(f.label)}</span>`:'';
  if(f.k==='choice'){
    const multi=!!f.multi,type=multi?'checkbox':'radio';
    return `<fieldset class="fld ch" data-j="${j}"><legend>${lab||''}${multi?`<span class="muted small"> (mehrere möglich)</span>`:''}</legend>${f.o.map((o,n)=>`<label class="opt"><input type="${type}" name="${id}" value="${n}"><span>${esc(o)}</span></label>`).join('')}</fieldset>`}
  const hint=f.k==='set'?'mehrere Werte mit ; trennen':f.k==='primes'?'z. B. 2 · 2 · 3':f.k==='expr'?'Term eingeben, z. B. 2x - 14':'';
  return `<div class="fld" data-j="${j}"><label for="${id}">${lab}</label><div class="inl"><input type="text" id="${id}" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(f.label||'Antwort')}">${f.unit?`<span class="unit">${esc(f.unit)}</span>`:''}</div>${hint?`<div class="muted small">${hint}</div>`:''}</div>`}
function itemHTML(it,i){

function leadText(q){if(q.lead_de)return q.lead_de;const i=q.prompt_de.search(/(^|\n)\s*a\)/);return i>0?q.prompt_de.slice(0,i).trim():''}
function readField(f,box){
  if(f.k==='choice')return [...box.querySelectorAll('input:checked')].map(x=>+x.value);
  return box.querySelector('input').value}
const empty=(f,v)=>f.k==='choice'?!v.length:!String(v).trim();
const collectVals=(card,it)=>{const boxes=[...card.querySelectorAll('.fld')];return it.answer.fields.map((f,j)=>readField(f,boxes[j]))};
function fillCard(card,it,vals){if(!vals)return;const boxes=[...card.querySelectorAll('.fld')];it.answer.fields.forEach((f,j)=>{const b=boxes[j],v=vals[j];if(v==null)return;if(f.k==='choice')b.querySelectorAll('input').forEach(x=>{x.checked=v.includes(+x.value)});else b.querySelector('input').value=v})}
function barHTML(){const total=run.queue?run.queue.length:0;return `<span>⭐ <b id="gx">${run.xp}</b> XP</span><span>🔥 Serie <b id="gc">${run.combo}</b></span><span>Aufgabe ${Math.min(run.n+1,total||run.n+1)}${total?' von '+total:''}</span>${run.timed?'<span class="timer" id="tm"></span>':''}`}
function updateBar(){const a=$('#gx'),b=$('#gc');if(a)a.textContent=run.xp;if(b)b.textContent=run.combo}
function renderQ(){
  const {q,t}=cu(),its=items(q),lead=q.parts&&q.parts.length?leadText(q):'';
  view(`<div class="gamebar">${barHTML()}</div>
  <div class="row" style="align-items:center"><span class="tag">${tTitle(t)}</span><span class="tag">${kl(q.klasse||t.klasse)}</span>${q.set?`<span class="tag">${esc(setName(q.set))}</span>`:''}</div>
  <h1>${esc(q.title_de)}</h1>${lead?`<p class="prompt muted">${esc(lead)}</p>`:''}${its.map(itemHTML).join('')}

  $('#stop').onclick=e=>{e.preventDefault();finishRun()};
  run.items.forEach((st,i)=>{const card=$(`.item[data-i="${i}"]`);if(!card)return;fillCard(card,its[i],st.vals);if(st.done)checkItem(card,i,st.skip,true)});

}
function tick(){clearInterval(tm);const f=()=>{const e=$('#tm');if(!e||!run){clearInterval(tm);return}const r=Math.max(0,SESSION_MIN*60-Math.floor((Date.now()-run.start)/1000));e.textContent=`⏱ ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`};f();tm=setInterval(f,1000)}
function answerText(f){return f.ans!=null?String(f.ans):(f.k==='choice'?f.c.map(n=>f.o[n]).join(', '):String(f.v))}
function checkItem(card,i,skip,restore){
  const it=items(cu().q)[i],fs=it.answer.fields,boxes=[...card.querySelectorAll('.fld')],out=$('.out',card);
  const vals=fs.map((f,j)=>readField(f,boxes[j]));
  if(!skip&&vals.some((v,j)=>empty(fs[j],v))){out.innerHTML=`<p class="badtxt">Bitte zuerst alle Felder ausfüllen.</p>`;return}
  let all=!skip;
  fs.forEach((f,j)=>{
    const r=skip?{ok:false}:Grade.grade(f,vals[j]);all=all&&r.ok;
    const b=boxes[j];b.classList.add(r.ok?'ok':'bad');b.querySelectorAll('input').forEach(x=>x.disabled=true);
    b.insertAdjacentHTML('beforeend',r.ok?`<div class="verdict good">✓ Richtig</div>`:`<div class="verdict badtxt">✗ Richtige Antwort: <b>${esc(answerText(f))}</b>${r.msg&&r.msg!=='?'?` <span class="muted small">(${esc(r.msg)})</span>`:''}</div>`)});
  card.querySelector('.act').hidden=true;
  out.innerHTML=`<p class="${all?'good':'badtxt'}"><b>${all?'Richtig ✓':skip?'Kein Problem – hier ist die Lösung.':'Nicht ganz – schau dir die Erklärung an.'}</b></p><div class="sol"><div class="muted small">Erklärung / Lösungsweg</div>${esc(it.solution_de||'')}</div>`;
  if(restore)return;
  run.items[i]={vals,done:true,skip:!!skip};run.res[i]=all;
  if(run.res.every(x=>x!==null))finishQ();else persist();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-act],button[data-next]');if(!b)return;
  if(b.dataset.next){return nextQ()}
  const a=b.dataset.act;
  if(a==='expl'){const box=b.closest('.vc').querySelector('.expl');box.hidden=!box.hidden;b.setAttribute('aria-expanded',String(!box.hidden));return}
  if(a==='cal'){calM.m+=+b.dataset.d;if(calM.m<0){calM.m=11;calM.y--}if(calM.m>11){calM.m=0;calM.y++}$('#cal').innerHTML=calHTML();return}
  if(a==='again-same'||a==='again-sim'){return again(a==='again-same')}
  if(!run||run.curQ==null)return;
  const card=b.closest('.item');if(!card)return;
  checkItem(card,+card.dataset.i,a==='skip');
});
document.addEventListener('input',ev=>{

document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('.item input[type=text]')){ev.preventDefault();const c=ev.target.closest('.item'),n=ev.target.closest('.fld').nextElementSibling;if(n&&n.matches('.fld')){n.querySelector('input').focus()}else if(!c.querySelector('.act').hidden)checkItem(c,+c.dataset.i,false)}});
function finishQ(){
  const {q,t}=cu(),ok=run.res.every(Boolean),frac=run.res.filter(Boolean).length/run.res.length,g=G(),lvB=levelOf(g.xp),p=P(),now=Date.now();
  const s=p.t[t.id]??={n:0,wrong:0};s.n++;if(!ok)s.wrong++;s.last=now;
  const r=p.q[q.id]??={box:0,n:0,ok:0};r.n++;if(ok){r.ok++;r.box=Math.min(4,r.box+1)}else r.box=0;r.due=now+BOX_DAYS[r.box]*DAY;
  let bonus=0;if(ok){run.combo++;bonus=Math.min(run.combo-1,5)*2}else run.combo=0;
  const pts=Math.round((10*frac+bonus)*run.mult);
  const l=S.log[today()]??={n:0,ok:0};l.n++;if(ok)l.ok++;l.xp=(l.xp||0)+pts;
  g.xp+=pts;run.xp+=pts;if(ok)g.correct++;g.best=Math.max(g.best,run.combo);
  const nb=awardBadges();run.newBadges.push(...nb.map(b=>b.id));
  const lvA=levelOf(g.xp);
  run.reward={pts,ok,combo:run.combo,lv:lvA>lvB?lvA:0,badges:nb.map(b=>b.id)};
  run.hist.push({q:q.id,t:t.id,ok});run.fin=true;run.n++;if(ok)run.ok++;
  persist();updateChip();updateBar();showNext();
}
function showNext(){
  const r=run.reward||{pts:0,combo:0,badges:[],ok:false},last=run.queue&&run.qi>=run.queue.length;

  <button class="btn big" data-next="1">${last?'Ergebnis ansehen':'Weiter'}</button>`;

}
function finishRun(){
  clearInterval(tm);
  if(!run){return go('#/')}
  const g=G(),lvB=levelOf(g.xp);let bonus=0,streakB=0,counted=false;
  if(run.n>=5&&!run.counted){
    const l=S.log[today()]??={n:0,ok:0},first=!(l.tests>0);
    l.tests=(l.tests||0)+1;g.tests++;counted=true;run.counted=true;

  const nb=awardBadges();run.newBadges.push(...nb.map(b=>b.id));

  S.last={date:today(),n:run.n,ok:run.ok,xp:run.xp,bonus,streakB,counted,stars:run.n===0?0:pct>=.9?3:pct>=.7?2:pct>=.4?1:0,
    lv:levelOf(g.xp)>lvB?levelOf(g.xp):0,badges:[...new Set(run.newBadges)],hist:run.hist,timed:run.timed,mult:run.mult};
  S.run=null;run=null;save();updateChip();go('#/summary')}
function summaryView(){

  ${L.hist&&L.hist.length?`<div class="row"><button class="btn" data-act="again-same">🔁 Nochmal: dieselben Aufgaben</button><button class="btn" data-act="again-sim">🎲 Nochmal: ähnliche Aufgaben</button></div>
  <p class="muted small">Ähnliche Aufgaben: gleiche Themen, andere Fragen. Dieselben Aufgaben geben halbe XP.</p>`:''}
  <div class="row"><a class="btn ghost" href="#/practice?timed=1">⏱ Neuer 15-Minuten-Test</a><a class="btn ghost" href="#/rewards">🏆 Belohnungen &amp; Kalender</a><a class="btn ghost" href="#/">Start</a></div>`)}
function again(same){
  const L=S.last;if(!L||!L.hist||!L.hist.length)return;const d=D[cur],used=new Set(L.hist.map(h=>h.q)),pick=new Set();let queue;
  if(same)queue=L.hist.map(h=>[h.q,h.t]);
  else queue=L.hist.map(h=>{
    const pool=(d.qByTopic[h.t]||[]);
    let c=pool.filter(q=>!used.has(q.id)&&!pick.has(q.id));
    if(!c.length){const t=d.tById[h.t];   // few tasks in this topic: use tasks of a neighbouring topic (same area, same Jahrgang)
      const nb=d.topics.filter(x=>x.id!==h.t&&x.area===t.area&&x.klasse===t.klasse);
      c=nb.flatMap(x=>d.qByTopic[x.id]||[]).filter(q=>!used.has(q.id)&&!pick.has(q.id))}
    if(!c.length)c=pool.filter(q=>q.id!==h.q&&!pick.has(q.id));
    if(!c.length)c=pool;
    const q=c[Math.floor(Math.random()*c.length)];pick.add(q.id);return [q.id,(q.topics&&q.topics[0])||h.t]});
  run=newRun({queue,mult:same?.5:1,timed:false});S.run=run;save();go('#/practice')}

function vocab(q){
  const d=D[cur],k=+q.get('k')||0,s=(q.get('s')||'').toLowerCase();
  const list=d.vocab.filter(v=>(!k||v.klasse===k)&&(!s||[v.de,v.en,v.zh].join(' ').toLowerCase().includes(s)));
  view(`<h1>${X('Wörter','Words')} DE · EN · 中文</h1><input type="text" id="vs" placeholder="Suchen / Search / 搜索" value="${esc(s)}">
  <div class="chips">${[0,...d.klassen].map(x=>`<a class="chip ${x===k?'on':''}" href="#/vocab?k=${x}&s=${encodeURIComponent(s)}">${x?kl(x):X('Alle','All')}</a>`).join('')}</div>
  <p class="muted small">${X(`${list.length} Wörter`,`${list.length} words`)}</p>
  <div class="card">${list.map(vocabCard).join('')}</div>`);
  $('#vs').onchange=e=>{location.hash=`#/vocab?k=${k}&s=${encodeURIComponent(e.target.value)}`};
}

function progress(){
  const d=D[cur],days=Object.keys(S.log).sort().slice(-14);
  view(`<h1>${X('Stand','Progress')}</h1><p class="muted small">Angemeldet als <b>${esc(USER)}</b></p>
  <h2>${X('Themen nach Schwäche','Topics by weakness')}</h2>${weakest(99).map(([t,w])=>{const s=P().t[t.id]||{n:0};return `<a class="card topic" href="#/topic/${t.id}"><div class="t">${esc(t.title_de)}</div><div class="muted small">${X(`${s.n} beantwortet · Schwäche ${Math.round(w*100)} %`,`${s.n} answered · weakness ${Math.round(w*100)} %`)}</div>${bar(w)}</a>`}).join('')}
  <h2>${X('Letzte Tage','Last days')}</h2><div class="card">${days.length?days.map(x=>`<div>${x}: ${S.log[x].ok}/${S.log[x].n} ${X('richtig','correct')}</div>`).join(''):`<span class="muted">${X('Noch nichts geübt.','Nothing practised yet.')}</span>`}</div>
  <h2>${X('Sicherung','Backup')}</h2><div class="card"><p class="small muted">${X('Der Fortschritt liegt nur in diesem Browser. Sichere ihn regelmäßig.','Your progress is stored in this browser only. Back it up often.')}</p>
  <div class="row"><button class="btn" id="exp">${X('Exportieren','Export')}</button><label class="btn ghost">${X('Importieren','Import')}<input id="imp" type="file" accept="application/json" hidden></label><button class="btn ghost" id="rst">${X('Zurücksetzen','Reset')}</button></div></div>
  <p><button class="btn ghost" id="lck">Abmelden (anderer Name)</button></p>`);
  $('#lck').onclick=lock;
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`abitur-fortschritt-${USER}-${today()}.json`;a.click()};
  $('#imp').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.v!==1)throw 0;S=x;save();await syncNow(true);alert('Importiert.');route()}catch(_){alert('Datei passt nicht.')}};
  $('#rst').onclick=()=>{if(confirm('Wirklich alles löschen?')){S={v:1,lang:S.lang,subject:S.subject,p:{},log:{}};run=null;save();syncNow(true);route()}};
}

/* ---------- router ---------- */
async function route(){
  const h=location.hash.slice(1)||'/',[path,qs]=h.split('?'),q=new URLSearchParams(qs||''),parts=path.split('/').filter(Boolean);
  clearInterval(tm);
  try{await loadSubject(cur)}catch(e){return view(`<p class="badtxt">Inhalt konnte nicht geladen werden: ${esc(e.message)}</p>`)}
  document.querySelectorAll('.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===({'':'home',practice:'practice',topics:'topics',topic:'topics',vocab:'vocab',progress:'progress',rewards:'rewards',summary:'practice'}[parts[0]||'']??'home')));
  const R={'':home,topics:()=>topics(q),topic:()=>topic(parts[1]),practice:()=>practice(q),vocab:()=>vocab(q),progress,rewards,summary:summaryView};
  (R[parts[0]||'']||home)();
}
async function boot(){
  await unlock();S=load();updateChip();
  setSyncState(SY()?'busy':'none');if(SY()){await Promise.race([syncNow(),sleep(7000)]);S.ts=S.ts||Date.now()}index={subjects:DB.subjects};
  const sel=$('#subject');sel.innerHTML=index.subjects.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('');
  cur=index.subjects.some(s=>s.id===S.subject)?S.subject:index.subjects[0].id;sel.value=cur;
  sel.onchange=()=>{cur=sel.value;S.subject=cur;save();location.hash='#/';route()};
  
  window.addEventListener('hashchange',route);route();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot().catch(e=>{$('#app').innerHTML='<p>Start fehlgeschlagen: '+esc(e.message)+'</p>'});

</script>
